name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default ("tools platform-tools") tries to install the
          # legacy "tools" package, which Google removed from the SDK
          # repository — that alone makes this step fail. cmdline-tools is
          # already set up by the action itself, so platform-tools is all we
          # need here.
          packages: 'platform-tools'

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geeta-saar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
